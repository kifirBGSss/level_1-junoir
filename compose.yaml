services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: task_manager
      POSTGRES_PASSWORD: task_manager_dev
      POSTGRES_DB: task_manager
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-tasks.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_manager -d task_manager"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://task_manager:task_manager_dev@db:5432/task_manager
      NODE_ENV: production
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  export:
    build:
      context: .
      dockerfile: Dockerfile.export
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://task_manager:task_manager_dev@db:5432/task_manager
    volumes:
      - ./exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
